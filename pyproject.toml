[project]
name = "receipt-reader"
version = "0.1.0"
description = "Receipt photo in, structured JSON out: OCR baseline vs open-weight vision model vs Claude, plus a cost-aware router, measured on CORD v2."
authors = [
    { name = "id-ahmad", email = "67088734+id-ahmad@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "datasets>=5.1.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# datasets ships no type information
module = ["datasets"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
